[project]
name = "openwrt-router-app"
version = "0.1.0"
description = "Mini aplicación local de administración y diagnóstico de un router OpenWrt vía SSH."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32",
    "paramiko>=3.4",
    "pydantic>=2.6",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "windows_discovery_integration: hits real PowerShell/local network, skipped by default (spec doc 03 section 13)",
]
addopts = '-m "not windows_discovery_integration"'
